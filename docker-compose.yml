services:
  nexus:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEXUS_DB_PATH: /app/data/nexus.db
      NEXUS_FRONTEND_ORIGINS: http://localhost:8000,http://localhost:5173
      NEXUS_DEMO_USERNAME: investigator
      NEXUS_DEMO_PASSWORD: nexus-demo
    volumes:
      - nexus-data:/app/data

volumes:
  nexus-data: